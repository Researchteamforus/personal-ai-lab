name: Paper 2 Lab Experiment

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab_connection_test.yml"
      - "github_dispatch.py"
      - "experiments/**"

concurrency:
  group: paper2-personal-ai-lab
  cancel-in-progress: true

jobs:
  paper2-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 95

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dispatcher dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Transfer Paper 2 backup from Personal AI Lab
        run: python github_dispatch.py

      - name: Upload verified Paper 2 backup to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: paper2-verified-backup-2026-08-11
          path: |
            paper2_artifacts/Paper2_COMPLETE_BACKUP.tar
            paper2_artifacts/Paper2_COMPLETE_BACKUP.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
