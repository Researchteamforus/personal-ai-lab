name: Paper 2 Lab Experiment

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab_connection_test.yml"
      - "github_dispatch.py"
      - "experiments/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: paper2-personal-ai-lab
  cancel-in-progress: true

jobs:
  paper2-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 95

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dispatcher dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run Paper 2 Personal AI Lab dispatcher
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python github_dispatch.py

      - name: Upload Paper 2 outputs to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: paper2-lab-output-${{ github.run_number }}
          path: paper2_artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
