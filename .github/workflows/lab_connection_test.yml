name: Paper 2 Lab Experiment

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab_connection_test.yml"
      - "github_dispatch.py"
      - "experiments/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: paper2-personal-ai-lab
  cancel-in-progress: true

jobs:
  paper2-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dispatcher dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run Paper 2 Personal AI Lab dispatcher
        run: python github_dispatch.py

      - name: Upload dispatcher manifest and logs
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-manifest-${{ github.run_number }}
          path: |
            paper2_artifacts/focused_revision_manifest.json
            paper2_artifacts/remote_*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload crossfit outer 0-1
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-crossfit-01-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_0_1.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_0_1.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload crossfit outer 2-3
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-crossfit-23-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_2_3.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_2_3.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload crossfit outer 4 and augmentation
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-crossfit-4-augmentation-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_4_augmentation.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_4_augmentation.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
