name: Paper 2 Lab Experiment

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab_connection_test.yml"
      - "github_dispatch.py"
      - "experiments/**"

concurrency:
  group: paper2-personal-ai-lab
  cancel-in-progress: true

jobs:
  paper2-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dispatcher dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Dispatch Paper 2 experiment to Personal AI Lab
        run: python github_dispatch.py
