name: Paper 2 Lab Experiment

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/lab_connection_test.yml"
      - "github_dispatch.py"
      - "experiments/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: paper2-personal-ai-lab
  cancel-in-progress: true

jobs:
  paper2-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dispatcher dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Run Paper 2 Personal AI Lab dispatcher
        run: python github_dispatch.py

      - name: Upload dispatcher manifest and logs
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-manifest-${{ github.run_number }}
          path: |
            paper2_artifacts/focused_revision_manifest.json
            paper2_artifacts/remote_*.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload outer fold 0
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-outer0-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_0.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_0.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload outer fold 1
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-outer1-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_1.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_1.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload outer fold 2
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-outer2-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_2.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_2.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload outer fold 3
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-outer3-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_3.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_3.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload outer fold 4
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-outer4-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_4.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_4.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload augmentation sensitivity
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-augmentation-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_augmentation_sensitivity.tar.gz
            paper2_artifacts/Paper2_FOCUSED_augmentation_sensitivity.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload role summaries
        uses: actions/upload-artifact@v4
        with:
          name: paper2-focused-role-summaries-${{ github.run_number }}
          path: |
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_0_1_2_summary.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_0_1_2_summary.tar.gz.sha256
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_3_4_augmentation_summary.tar.gz
            paper2_artifacts/Paper2_FOCUSED_crossfit_outer_3_4_augmentation_summary.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
