name: Paper 2 - 1000 Microsteps

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/paper2_microsteps_1000.yml"
      - "paper2_microstep_dispatch.py"
      - "paper2_microstep_recover.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: paper2-microsteps-1000
  cancel-in-progress: true

jobs:
  run-microsteps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dispatcher dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Recover stale coordinator and start two-GPU microsteps
        env:
          MICRO_POLL_SECONDS: "300"
          MICRO_MAX_SECONDS: "18000"
        run: python paper2_microstep_recover.py
