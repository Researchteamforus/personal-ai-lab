name: Personal AI Lab Lightweight Smoke Test

on:
  push:
    branches:
      - lab-smoke-test-20260820
    paths:
      - "lab_smoke_test.py"
      - ".github/workflows/lab_smoke_test.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests only
        run: python -m pip install --disable-pip-version-check requests

      - name: Run lightweight Node2 GPU smoke test
        run: python lab_smoke_test.py
