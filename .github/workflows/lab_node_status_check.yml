name: Personal AI Lab Node Status Check
on:
  push:
    paths:
      - '.github/workflows/lab_node_status_check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          # lab-on preflight 2026-08-20
          python - <<'PY'
          import json, urllib.request
          base='https://miomiomiomizan-personal-ai-lab.hf.space'
          d=json.load(urllib.request.urlopen(base+'/get_state',timeout=30)); tid=d.get('execution',{}).get('current_task_id')
          print('EXEC_STATUS',d.get('execution',{}).get('status')); print('EXEC_TASK',tid)
          if tid:
              r=json.load(urllib.request.urlopen(base+'/get_task_result/'+tid,timeout=30)); print('TASK_RESULT_STATUS',r.get('status')); print('RESPONSES',list(r.get('responses',{}).keys()))
          print('RECENT_LOGS',json.dumps(d.get('logs',[])[:15],default=str))
          for n in d.get('nodes',[]): print('NODE',n.get('node_id'),n.get('status'),n.get('tasks_completed'),n.get('last_ping'))
          PY
