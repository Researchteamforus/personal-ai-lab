name: Personal AI Lab Node Status Check
on:
  push:
    paths:
      - '.github/workflows/lab_node_status_check.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query coordinator and persist compact status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # focused monitor compact
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          base='https://miomiomiomizan-personal-ai-lab.hf.space'
          repo='Researchteamforus/personal-ai-lab'
          state=json.load(urllib.request.urlopen(base+'/get_state',timeout=30))
          ex=state.get('execution',{})
          tid=ex.get('current_task_id')
          task=None
          if tid:
              try:
                  raw=json.load(urllib.request.urlopen(base+'/get_task_result/'+tid,timeout=30))
                  task={'status':raw.get('status'),'response_nodes':list(raw.get('responses',{}).keys()),'n_responses':len(raw.get('responses',{}))}
              except Exception as e:
                  task={'error':repr(e)}
          payload={
              'execution':{'status':ex.get('status'),'current_task_id':tid,'node_targets':ex.get('node_targets',[]),'progress':ex.get('progress')},
              'nodes':[{'node_id':n.get('node_id'),'status':n.get('status'),'tasks_completed':n.get('tasks_completed'),'last_ping':n.get('last_ping'),'gpu_name':n.get('gpu_name')} for n in state.get('nodes',[])],
              'logs':state.get('logs',[])[:20],
              'task':task,
          }
          text=json.dumps(payload,indent=2,default=str)
          path='results/lab_status_latest.json'
          api=f'https://api.github.com/repos/{repo}/contents/{path}'
          token=os.environ['GITHUB_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json'}
          sha=None
          try:
              req=urllib.request.Request(api,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          body={'message':'Persist compact AI Lab status','content':base64.b64encode(text.encode()).decode()}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers=headers,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r: print(r.status)
          print(text)
          PY
