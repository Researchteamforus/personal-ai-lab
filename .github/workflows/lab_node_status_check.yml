name: Personal AI Lab Node Status Check
on:
  push:
    paths:
      - '.github/workflows/lab_node_status_check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import json,urllib.request
          d=json.load(urllib.request.urlopen('https://miomiomiomizan-personal-ai-lab.hf.space/get_state',timeout=30))
          print('EXEC',json.dumps(d.get('execution',{}),default=str))
          for n in d.get('nodes',[]): print('NODE',n.get('node_id'),n.get('status'),n.get('last_ping'),n.get('tasks_completed'))
          PY
