name: Personal AI Lab Node Status Check
on:
  push:
    paths:
      - '.github/workflows/lab_node_status_check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python - <<'PY'
          import json,urllib.request
          base='https://miomiomiomizan-personal-ai-lab.hf.space'
          tid='dac1aec3-c6c3-4b1a-b969-9942c2e0507e'
          d=json.load(urllib.request.urlopen(base+'/get_task_result/'+tid,timeout=30))
          print('OLD_HIBA_TASK_BEGIN')
          print(json.dumps(d,indent=2,default=str))
          print('OLD_HIBA_TASK_END')
          PY
