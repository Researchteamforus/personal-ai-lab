name: Personal AI Lab Node Status Check
on:
  push:
    paths:
      - '.github/workflows/lab_node_status_check.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query coordinator and persist status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # focused monitor 1
          python - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          base='https://miomiomiomizan-personal-ai-lab.hf.space'
          repo='Researchteamforus/personal-ai-lab'
          state=json.load(urllib.request.urlopen(base+'/get_state',timeout=30))
          tid=state.get('execution',{}).get('current_task_id')
          task=None
          if tid:
              try:
                  task=json.load(urllib.request.urlopen(base+'/get_task_result/'+tid,timeout=30))
              except Exception as e:
                  task={'error':repr(e)}
          payload={
              'execution':state.get('execution',{}),
              'nodes':state.get('nodes',[]),
              'logs':state.get('logs',[])[:30],
              'task_id':tid,
              'task':task,
          }
          text=json.dumps(payload,indent=2,default=str)
          path='results/lab_status_latest.json'
          api=f'https://api.github.com/repos/{repo}/contents/{path}'
          token=os.environ['GITHUB_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','Content-Type':'application/json'}
          sha=None
          try:
              req=urllib.request.Request(api,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: sha=json.load(r).get('sha')
          except urllib.error.HTTPError as e:
              if e.code!=404: raise
          body={'message':'Persist current AI Lab status','content':base64.b64encode(text.encode()).decode()}
          if sha: body['sha']=sha
          req=urllib.request.Request(api,data=json.dumps(body).encode(),headers=headers,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as r: print(r.status)
          print('EXEC_STATUS',state.get('execution',{}).get('status'))
          print('EXEC_TASK',tid)
          print('TASK_STATUS',task.get('status') if isinstance(task,dict) else None)
          print('RESPONSES',list((task or {}).get('responses',{}).keys()) if isinstance(task,dict) else [])
          for n in state.get('nodes',[]): print('NODE',n.get('node_id'),n.get('status'),n.get('tasks_completed'),n.get('last_ping'))
          PY
